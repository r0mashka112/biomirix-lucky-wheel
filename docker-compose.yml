services:
  backend:
    build:
      context: ./backend
    container_name: biomirix_backend
    restart: always
    init: true
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - biomirix_network

  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: biomirix_bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./telegram-bot:/app
    expose:
      - "8000"
    networks:
      - biomirix_network


  nginx:
    image: nginx:latest
    container_name: biomirix_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./static:/usr/share/nginx/html
    depends_on:
      - backend
      - telegram-bot
    networks:
      - biomirix_network

  db:
    image: postgres:16
    container_name: biomirix_db
    restart: always
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U r0mashka -d biomirix" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - biomirix_network

volumes:
  postgres_data:
  backend_node_modules:

networks:
  biomirix_network: