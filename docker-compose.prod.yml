services:
  backend:
    build:
      context: ./backend
    container_name: biomirix_backend
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - biomirix_network

  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: biomirix_bot
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "8000"
    networks:
      - biomirix_network

  nginx:
    image: nginx:1.28-alpine
    container_name: biomirix_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - telegram-bot
    networks:
      - biomirix_network

  db:
    image: postgres:16-alpine
    container_name: biomirix_db
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - biomirix_network

volumes:
  postgres_data:

networks:
  biomirix_network:
    driver: bridge